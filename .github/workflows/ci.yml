name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Lint
        run: pnpm lint

      # Both suites. The stories bind real ports and assert against real
      # servers, so a broken protocol claim fails the PR rather than shipping
      # a diagram that lies.
      - name: Stories
        run: pnpm test:story

      - name: Unit tests
        run: pnpm test
